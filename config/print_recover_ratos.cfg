# RatOS lite start for print_recover — NO calibration / priming / QGL / Beacon contact.
# Include AFTER RatOS macros, e.g. in printer.cfg:
#   [include print_recover.cfg]
#   [include print_recover_ratos.cfg]
#
# Sets START_PRINT.is_printing_gcode so RatOS print-path macros do not block,
# loads the saved mesh + skew profiles, heats, optional XY home.

[gcode_macro RECOVER_START_PRINT]
description: print_recover RatOS resume bootstrap (mesh+skew load, no calib)
gcode:
    {% set bed_temp = params.BED_TEMP|default(0)|float %}
    {% set extruder_temp = params.EXTRUDER_TEMP|default(0)|float %}
    {% set mesh_profile = params.MESH_PROFILE|default("")|trim %}
    {% set skew_profile = params.SKEW_PROFILE|default("")|trim %}
    {% set home_xy = params.HOME_XY|default(1)|int %}

    {% if printer["gcode_macro START_PRINT"] is not defined %}
        { action_raise_error("RECOVER_START_PRINT requires RatOS START_PRINT macro") }
    {% endif %}

    RESPOND MSG="print_recover: RatOS lite start (no calibration)"

    # --- heat (no heatsoak / chamber dance) ---
    {% if bed_temp > 0 %}
        M140 S{bed_temp}
    {% endif %}
    {% if extruder_temp > 0 %}
        M104 S{extruder_temp}
    {% endif %}
    {% if bed_temp > 0 %}
        M190 S{bed_temp}
    {% endif %}
    {% if extruder_temp > 0 %}
        M109 S{extruder_temp}
    {% endif %}

    # --- XY home only (Z comes from SET_KINEMATIC_POSITION in preamble) ---
    {% if home_xy %}
        G28 X Y
    {% endif %}

    # --- load existing mesh (never BED_MESH_CALIBRATE) ---
    {% if mesh_profile == "" %}
        {% set mesh_profile = printer["gcode_macro RatOS"].bed_mesh_profile|default("ratos") %}
    {% endif %}
    {% if mesh_profile != "" %}
        BED_MESH_CLEAR
        BED_MESH_PROFILE LOAD="{mesh_profile}"
        RESPOND MSG="print_recover: loaded mesh profile {mesh_profile}"
    {% endif %}

    # --- load skew (never recalibrate) ---
    {% if skew_profile != "" %}
        SKEW_PROFILE LOAD={skew_profile}
        RESPOND MSG="print_recover: loaded skew profile {skew_profile}"
    {% elif printer["gcode_macro _LOAD_RATOS_SKEW_PROFILE"] is defined %}
        _LOAD_RATOS_SKEW_PROFILE
    {% endif %}

    # Unblock RatOS macros that gate on is_printing_gcode
    SET_GCODE_VARIABLE MACRO=START_PRINT VARIABLE=is_printing_gcode VALUE=True

    {% if printer["gcode_macro _SET_EXTRUSION_MODE"] is defined %}
        _SET_EXTRUSION_MODE
    {% endif %}

    {% if printer["gcode_macro _LED_PRINTING"] is defined %}
        _LED_PRINTING
    {% endif %}

    M117 Recovering...
    RESPOND MSG="print_recover: START_PRINT.is_printing_gcode=True"
